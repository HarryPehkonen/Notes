[project]
name = "notes-api-characterization"
version = "0.1.0"
description = "Black-box characterization test suite for the Notes API"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
markers = [
    "readonly: safe against production — no writes, no side effects",
    "isolation: multi-user row-level-security checks; needs two scratch users/tokens, local server only",
    "scopes: what an API token may do (scopes, expiry, revocation); needs seeded scratch tokens, local server only",
    "session: the endpoints a token may not touch; needs a session (DEV_USER_EMAIL), local server only",
]
testpaths = ["."]