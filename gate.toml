# Notes' gate. The policy is this file; the engine is kit-ci, installed once per machine:
#
#     cmake -S ~/hermes-workspace/KitCI -B build && cmake --build build
#     cmake --install build --prefix ~/.local        # -> ~/.local/bin/kit-ci
#
# One definition, three callers - by hand (scripts/gate.sh), git on push (.githooks/, which
# names the tier), and a clean checkout elsewhere (the Pi's nightly job: a fresh `git clone`
# into a temp dir, then the same scripts/gate.sh). Changing the gate means editing this file:
# `kit-ci --list` and `kit-ci --graph` read the same parse the run uses.
#
# Until 2026-10-06 the gate WAS one file: a 163-line scripts/gate.sh that ran five steps and
# printed its own summary (card t_075c0a6f). Every check it ran is declared here, in the order
# it ran them, and the work of a check lives in a script next to this file.

[gate]
repo = "notes"

# This repo's checks are cheap (a 4-second suite, a 1-second lint) and this repo has only one
# caller - .githooks/pre-push, which runs the whole gate. Both tiers hold the same stages so a
# stage added above cannot be run by one caller and forgotten by the other.
[tier.fast]
stages = ["lint", "tests", "format", "version"]

[tier.full]
stages = ["*"]

# quiet on success: one line. Loud on failure: the rules, verbatim.
[stage.lint]
cmd = "scripts/lint.sh"

# the suite, with the wire-contract guards (client URL vs server route, payload keys,
# response shapes) that catch a component/API mismatch no pure-function test can see
[stage.tests]
cmd = "scripts/tests.sh"

# only the files this branch touches, and the STAGED copy of them, because a commit records
# the index rather than the working tree
[stage.format]
cmd = "scripts/format.sh"

# a public/ change without bumping public/version.js is a deploy that stays invisible on a
# phone that has the service worker cached
[stage.version]
cmd = "scripts/version.sh"

# ---------------------------------------------------------------- what did not survive
# `kitprobes` - the step that ran tools/kit-probes/*.sh, holding this copy to the
# AI-DEV-STARTER fixes it claimed to carry. Its subject was scripts/gate.sh, which this
# conversion replaces, so the probe is deleted with it and the guarantee it stood for is
# recorded in INCIDENTS.md with the file that now carries it (scripts/format.sh).
#
# This repo has no pre-commit hook (it never had one), so nothing names the fast tier yet; the
# tier exists so that adding one later is a one-line change in .githooks/.
